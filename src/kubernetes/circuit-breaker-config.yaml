# DestinationRule для монолита
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: monolith-circuit-breaker
  namespace: cinemaabyss
spec:
  host: monolith
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10          # Максимальное количество TCP соединений
        connectTimeout: 30ms         # Таймаут подключения
      http:
        http1MaxPendingRequests: 5   # Максимальное количество ожидающих запросов
        http2MaxRequests: 10         # Максимальное количество параллельных запросов
        maxRequestsPerConnection: 5  # Максимальное количество запросов на одно соединение
        maxRetries: 3                # Максимальное количество повторных попыток
    outlierDetection:
      consecutive5xxErrors: 5        # Количество 5xx ошибок для исключения из LB
      interval: 30s                   # Интервал проверки
      baseEjectionTime: 60s           # Базовое время исключения
      maxEjectionPercent: 50          # Максимальный процент исключенных подов
      minHealthPercent: 50             # Минимальный процент здоровых подов
    loadBalancer:
      simple: ROUND_ROBIN
    tls:
      mode: DISABLE
---
# DestinationRule для movies-service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: movies-service-circuit-breaker
  namespace: cinemaabyss
spec:
  host: movies-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 15          # Немного больше для микросервиса
        connectTimeout: 20ms
      http:
        http1MaxPendingRequests: 8
        http2MaxRequests: 15
        maxRequestsPerConnection: 10
        maxRetries: 5
    outlierDetection:
      consecutive5xxErrors: 3        # Более чувствительно для микросервиса
      interval: 20s
      baseEjectionTime: 30s
      maxEjectionPercent: 60
      minHealthPercent: 40
    loadBalancer:
      simple: LEAST_REQUEST          # Для микросервиса лучше LEAST_REQUEST
    tls:
      mode: DISABLE
---
# VirtualService для монолита
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: monolith-vs
  namespace: cinemaabyss
spec:
  hosts:
    - monolith
  http:
    - route:
        - destination:
            host: monolith
          weight: 100
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 10s
---
# VirtualService для movies-service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: movies-service-vs
  namespace: cinemaabyss
spec:
  hosts:
    - movies-service
  http:
    - route:
        - destination:
            host: movies-service
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 10s
      mirror:
        host: movies-service
      mirrorPercentage:
        value: 0
---