{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: proxy-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: proxy-service
      annotations:
        {{- if .Values.proxyService.annotations }}
        {{- toYaml .Values.proxyService.annotations | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: proxy-service
          image: {{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}
          imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.proxyService.service.port }}
          env:
          - name: PORT
            value: "{{ .Values.proxyService.service.port }}"
          - name: MONOLITH_URL
            value: {{ .Values.proxyService.env.monolithUrl | quote }}
          - name: MOVIES_SERVICE_URL
            value: {{ .Values.proxyService.env.moviesServiceUrl | quote }}
          - name: EVENTS_SERVICE_URL
            value: {{ .Values.proxyService.env.eventsServiceUrl | quote }}
          - name: MOVIES_MIGRATION_PERCENT
            value: "{{ .Values.proxyService.env.moviesMigrationPercent }}"
          envFrom:
          - configMapRef:
              name: cinemaabyss-config
          - secretRef:
              name: cinemaabyss-secrets
          resources:
            limits:
              cpu: {{ .Values.proxyService.resources.limits.cpu }}
              memory: {{ .Values.proxyService.resources.limits.memory }}
            requests:
              cpu: {{ .Values.proxyService.resources.requests.cpu }}
              memory: {{ .Values.proxyService.resources.requests.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.proxyService.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.proxyService.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
      restartPolicy: Always
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: proxy-service
  ports:
    - port: {{ .Values.proxyService.service.port }}
      targetPort: {{ .Values.proxyService.service.targetPort }}
  type: {{ .Values.proxyService.service.type }}
{{- end }}